<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitoring Obywatelski</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Leaflet MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Leaflet MarkerCluster JS -->
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f14;
      --panel:     #13161e;
      --panel2:    #1a1e2a;
      --border:    #252a38;
      --accent:    #e63946;
      --accent2:   #f4a261;
      --accent3:   #2a9d8f;
      --accent4:   #457b9d;
      --text:      #e0e4f0;
      --text2:     #7a849e;
      --radius:    10px;
      --shadow:    0 4px 24px rgba(0,0,0,.5);
      --card-hover: #3a4060;
      --card-active-bg: #1e2235;
      --card-active-border: #4a5080;
      --header-grad: linear-gradient(135deg,#1a1e2a 0%,#0d1220 100%);
      --popup-bg: #13161e;
      --tip-bg: rgba(13,15,20,.85);
    }

    /* ── LIGHT THEME ── */
    [data-theme="light"] {
      --bg:        #f0f2f7;
      --panel:     #ffffff;
      --panel2:    #f5f7fb;
      --border:    #dde1ea;
      --text:      #1a1e2a;
      --text2:     #6b7280;
      --shadow:    0 4px 24px rgba(0,0,0,.12);
      --card-hover: #c8cfe0;
      --card-active-bg: #e8ecf8;
      --card-active-border: #a0b0d0;
      --header-grad: linear-gradient(135deg,#e8ecf8 0%,#d4daf0 100%);
      --popup-bg: #ffffff;
      --tip-bg: rgba(240,242,247,.95);
    }

    /* ── SATELLITE THEME (dark UI) ── */
    [data-theme="satellite"] {
      --bg:        #080c10;
      --panel:     #0e1218;
      --panel2:    #141a22;
      --border:    #1e2830;
      --text:      #d0e0f0;
      --text2:     #607080;
      --shadow:    0 4px 24px rgba(0,0,0,.7);
      --card-hover: #2a3840;
      --card-active-bg: #182028;
      --card-active-border: #3a5060;
      --header-grad: linear-gradient(135deg,#0e1a22 0%,#060c12 100%);
      --popup-bg: #0e1218;
      --tip-bg: rgba(8,12,16,.9);
    }

    html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

    /* ── LAYOUT ─────────────────────────────────────── */
    #app { height: 100vh; }
    #map-wrap { position: relative; width: 100%; height: 100%; }
    /* ── MAP ─────────────────────────────────────── */
    #map { width: 100%; height: 100%; }

    /* Dark theme based on OSM tiles: apply filter to whole tile pane to avoid seams. */
    [data-theme="dark"] #map .leaflet-tile-pane {
      filter: invert(100%) hue-rotate(180deg) brightness(92%) contrast(90%) saturate(75%);
    }
    [data-theme="light"] #map .leaflet-tile-pane,
    [data-theme="satellite"] #map .leaflet-tile-pane {
      filter: none;
    }

    /* leaflet popup custom */
    .leaflet-popup-content-wrapper {
      background: var(--popup-bg) !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius) !important;
      box-shadow: var(--shadow) !important;
      color: var(--text) !important;
    }
    .leaflet-popup-tip { background: var(--popup-bg) !important; }
    .leaflet-popup-content { margin: 14px 16px !important; min-width: 220px; }

    /* ── REVIEW PANEL ──────────────────────────────────────── */
    #review-panel {
      position: fixed; bottom: 24px; right: 24px;
      width: 340px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px 18px;
      box-shadow: var(--shadow); z-index: 800;
      font-family: 'Inter', sans-serif;
    }
    #review-panel h3 {
      font-size: .82rem; font-weight: 700; margin-bottom: 10px;
      display: flex; align-items: center; gap: 7px; color: var(--text);
    }
    #review-panel h3 i { color: var(--accent2); }
    #review-list {
      font-size: .74rem; color: var(--text2);
      max-height: 120px; overflow-y: auto;
      margin-bottom: 10px; line-height: 1.8;
    }
    #review-list .rv-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 2px 0; border-bottom: 1px solid var(--border);
    }
    #review-list .rv-item:last-child { border-bottom: none; }
    #review-list .rv-remove {
      cursor: pointer; color: var(--accent); font-size: .7rem; padding: 0 4px;
    }
    #review-empty { font-size: .74rem; color: var(--text2); font-style: italic; }
    #review-cmd-wrap { display: none; }
    #review-cmd {
      font-size: .68rem; font-family: monospace;
      background: var(--panel2); border: 1px solid var(--border);
      border-radius: 7px; padding: 7px 10px; color: var(--text2);
      word-break: break-all; line-height: 1.5; margin-bottom: 8px;
    }
    #review-copy-btn {
      width: 100%; padding: 8px;
      background: linear-gradient(135deg, var(--accent3), #1a7a70);
      border: none; border-radius: 8px;
      color: #fff; font-family: inherit; font-size: .8rem; font-weight: 600;
      cursor: pointer; transition: opacity .2s;
    }
    #review-copy-btn:hover { opacity: .85; }
    #review-clear-btn {
      width: 100%; margin-top: 6px; padding: 6px;
      background: transparent; border: 1px solid var(--border);
      border-radius: 8px; color: var(--text2);
      font-family: inherit; font-size: .75rem; cursor: pointer;
    }
    #review-clear-btn:hover { color: var(--text); border-color: #3a4060; }
    #review-discover-btn {
      width: 100%; padding: 8px; margin-bottom: 12px;
      background: linear-gradient(135deg, var(--accent4), #2a5a7a);
      border: none; border-radius: 8px;
      color: #fff; font-family: inherit; font-size: .8rem; font-weight: 600;
      cursor: pointer; transition: opacity .2s;
    }
    #review-discover-btn:hover { opacity: .85; }

    /* ── SOURCE FILTER PANEL ─────────────────────────────── */
    #source-panel {
      position: absolute; top: 80px; left: 16px;
      background: var(--tip-bg); backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px; z-index: 2000;
      max-width: 210px; min-width: 160px;
      font-family: 'Inter', sans-serif;
    }
    #source-panel h4 {
      font-size: .7rem; text-transform: uppercase; letter-spacing: .08em;
      color: var(--text2); margin-bottom: 8px;
      display: flex; align-items: center; gap: 5px;
    }
    #source-chips { display: flex; flex-direction: column; gap: 3px; }
    .src-chip {
      display: flex; align-items: center; justify-content: space-between;
      font-size: .72rem; padding: 4px 10px;
      border-radius: 20px; cursor: pointer;
      border: 1px solid var(--border);
      background: transparent; color: var(--text2);
      font-family: inherit;
      transition: all .15s; white-space: nowrap; width: 100%;
      text-align: left;
    }
    .src-chip:hover { color: var(--text); border-color: var(--accent4); }
    .src-chip.active { background: rgba(69,123,157,.2); border-color: var(--accent4); color: var(--text); }
    .src-chip.active .src-count { color: var(--accent4); }
    .src-count { font-size: .65rem; color: var(--text2); margin-left: 4px; }
    #src-all-btn {
      font-size: .68rem; padding: 3px 0; margin-bottom: 4px; margin-top: 2px;
      background: transparent; border: none;
      color: var(--accent4); cursor: pointer; font-family: inherit;
      text-align: left; text-decoration: underline;
    }
    #src-all-btn:hover { color: var(--text); }

    /* ── CLUSTER ─────────────────────────────────────────── */
    .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large {
      background-clip: padding-box;
    }
    .marker-cluster-small div        { background-color: rgba(69,123,157,.85); }
    .marker-cluster-small            { background-color: rgba(69,123,157,.4); }
    .marker-cluster-medium div       { background-color: rgba(244,162,97,.85); }
    .marker-cluster-medium           { background-color: rgba(244,162,97,.4); }
    .marker-cluster-large div        { background-color: rgba(230,57,70,.85); }
    .marker-cluster-large            { background-color: rgba(230,57,70,.4); }
    .marker-cluster div {
      color: #fff; font-family: 'Inter', sans-serif;
      font-size: .78rem; font-weight: 700;
    }

    /* ── PULSE MARKERS ─────────────────────────────────────── */
    .pulse-marker {
      position: relative;
      width: 20px; height: 20px;
    }
    .pulse-marker .dot {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 12px; height: 12px;
      border-radius: 50%;
    }
    .pulse-marker .ring {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 28px; height: 28px;
      border-radius: 50%;
      animation: pulse-ring 1.8s ease-out infinite;
    }
    @keyframes pulse-ring {
      0%   { width: 12px; height: 12px; opacity: .8; }
      100% { width: 36px; height: 36px; opacity: 0; }
    }
    /* colors per type */
    .pm-crash .dot  { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .pm-crash .ring { border: 2px solid var(--accent); }
    .pm-fire  .dot  { background: #e67e22; box-shadow: 0 0 8px #e67e22; }
    .pm-fire  .ring { border: 2px solid #e67e22; }
    .pm-flood .dot  { background: var(--accent4); box-shadow: 0 0 8px var(--accent4); }
    .pm-flood .ring { border: 2px solid var(--accent4); }
    .pm-other .dot  { background: var(--accent3); box-shadow: 0 0 8px var(--accent3); }
    .pm-other .ring { border: 2px solid var(--accent3); }
    .pm-pending .dot  { background: #7db4ff; box-shadow: 0 0 8px #7db4ff; }
    .pm-pending .ring { border: 2px solid #7db4ff; }

    /* severity glow boost */
    .sev-3 .dot { animation: sev-glow 1s ease-in-out infinite alternate; }
    @keyframes sev-glow {
      from { filter: brightness(1); }
      to   { filter: brightness(1.8) drop-shadow(0 0 6px currentColor); }
    }

    /* notification toast */
    #toast {
      position: fixed; bottom: 30px; right: 30px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 18px;
      font-size: .82rem;
      box-shadow: var(--shadow);
      z-index: 9999;
      transform: translateY(10px); opacity: 0;
      transition: all .3s;
      pointer-events: none;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast i { margin-right: 8px; color: var(--accent3); }

    /* legend */
    /* theme switcher */
    #theme-switcher {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 0;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 30px; overflow: hidden;
      box-shadow: var(--shadow);
      z-index: 600;
    }
    .theme-btn {
      padding: 7px 16px; font-size: .76rem; font-family: inherit;
      border: none; background: transparent; color: var(--text2);
      cursor: pointer; transition: all .2s;
      display: flex; align-items: center; gap: 5px;
      white-space: nowrap;
    }
    .theme-btn:not(:last-child) { border-right: 1px solid var(--border); }
    .theme-btn:hover { color: var(--text); background: var(--panel2); }
    .theme-btn.active { background: var(--panel2); color: var(--text); font-weight: 600; }
    .theme-btn.active .th-dot { opacity: 1; }
    .th-dot { width: 7px; height: 7px; border-radius: 50%; opacity: .5; transition: opacity .2s; }
    .td-dark { background: #457b9d; }
    .td-light { background: #f4a261; }
    .td-sat   { background: #2a9d8f; }

    #legend {
      position: absolute; top: 16px; right: 16px;
      background: var(--tip-bg); backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      z-index: 500; font-size: .75rem;
    }
    #legend h4 { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--text2); margin-bottom: 8px; }
    .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    .ld-crash { background: var(--accent); box-shadow: 0 0 5px var(--accent); }
    .ld-fire  { background: #e67e22; box-shadow: 0 0 5px #e67e22; }
    .ld-flood { background: var(--accent4); box-shadow: 0 0 5px var(--accent4); }
    .ld-other { background: var(--accent3); box-shadow: 0 0 5px var(--accent3); }

    /* ── TIMELINE BAR ───────────────────────────────────── */
    #timeline-bar {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 10px;
      background: var(--tip-bg); backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 30px; padding: 8px 16px;
      box-shadow: var(--shadow); z-index: 600;
      font-family: 'Inter', sans-serif; font-size: .78rem;
      white-space: nowrap;
      transition: opacity .2s;
    }
    #timeline-bar i { color: var(--accent4); }
    #tl-label {
      min-width: 80px; text-align: center;
      color: var(--text); font-weight: 600;
    }
    #timeline-bar.tl-off #tl-label { color: var(--text2); }
    #tl-slider {
      -webkit-appearance: none; appearance: none;
      width: 320px; height: 4px;
      border-radius: 2px; outline: none; cursor: pointer;
      background: linear-gradient(to right, var(--accent4) 0%, var(--accent4) var(--pct,0%), var(--border) var(--pct,0%), var(--border) 100%);
      transition: opacity .2s;
    }
    #tl-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px;
      border-radius: 50%; background: var(--accent4);
      box-shadow: 0 0 4px rgba(69,123,157,.7); cursor: pointer;
    }
    #timeline-bar.tl-off #tl-slider { opacity: .3; pointer-events: none; }
    #tl-toggle {
      background: transparent; border: 1px solid var(--accent4);
      border-radius: 20px; padding: 3px 11px;
      color: var(--accent4); font-size: .72rem; font-family: inherit;
      cursor: pointer; transition: all .2s; white-space: nowrap;
    }
    #tl-toggle:hover { background: rgba(69,123,157,.15); }
    #timeline-bar.tl-off #tl-toggle {
      border-color: var(--text2); color: var(--text2);
    }
    #tl-sep { color: var(--border); user-select: none; }

    /* Leaflet overrides */
    .leaflet-control-zoom { border: 1px solid var(--border) !important; }
    .leaflet-control-zoom a {
      background: var(--panel) !important; color: var(--text) !important;
      border-color: var(--border) !important;
    }
    .leaflet-control-zoom a:hover { background: var(--panel2) !important; }
    .leaflet-control-attribution { display: none !important; }
  </style>
</head>
<body>
<div id="app">
  <!-- ── MAP ── -->
  <div id="map-wrap">
    <div id="map"></div>

    <!-- Source filter panel -->
    <div id="source-panel">
      <h4><i class="fa-solid fa-filter"></i> Serwisy</h4>
      <button id="src-all-btn" onclick="clearSourceFilter()">Pokaż wszystkie</button>
      <div id="source-chips"><span style="font-size:.72rem;color:var(--text2);font-style:italic">Wczytywanie…</span></div>
    </div>

    <!-- Legend -->
    <div id="legend">
      <h4><i class="fa-solid fa-circle-info" style="margin-right:4px"></i> Legenda</h4>
      <div class="legend-item"><div class="legend-dot ld-crash"></div> Wypadek drogowy</div>
      <div class="legend-item"><div class="legend-dot ld-fire"></div> Pozar</div>
      <div class="legend-item"><div class="legend-dot ld-flood"></div> Powodz</div>
      <div class="legend-item"><div class="legend-dot ld-other"></div> Inne zdarzenie</div>
    </div>

    <!-- Theme Switcher -->
    <div id="theme-switcher">
      <button class="theme-btn active" data-theme="dark" onclick="setTheme('dark',this)">
        <span class="th-dot td-dark"></span> Ciemna
      </button>
      <button class="theme-btn" data-theme="light" onclick="setTheme('light',this)">
        <span class="th-dot td-light"></span> Jasna
      </button>
      <button class="theme-btn" data-theme="satellite" onclick="setTheme('satellite',this)">
        <span class="th-dot td-sat"></span> Satelita
      </button>
    </div>

    <!-- Timeline bar -->
    <div id="timeline-bar">
      <i class="fa-solid fa-clock-rotate-left"></i>
      <span id="tl-label">7 dni</span>
      <input type="range" id="tl-slider" min="0" max="365" value="7" step="1"
             oninput="onTimelineSlider(this.value)" />
      <span id="tl-sep">|</span>
      <button id="tl-toggle" onclick="toggleTimeline()">Pokaż wszystkie</button>
    </div>

  </div>
</div>


<!-- REVIEW PANEL -->
<div id="review-panel" style="display:none">
  <h3><i class="fa-solid fa-clipboard-check"></i> Zatwierdź incydenty</h3>
  <button id="review-discover-btn" onclick="copyDiscoverCmd()"><i class="fa-solid fa-magnifying-glass"></i> Kopiuj komendę szukania</button>
  <div id="review-list"><span id="review-empty">Brak wybranych — kliknij "Zatwierdź" na markerze.</span></div>
  <div id="review-cmd-wrap">
    <div id="review-cmd"></div>
    <button id="review-copy-btn" onclick="copyReviewCmd()"><i class="fa-solid fa-copy"></i> Kopiuj komendę</button>
    <button id="review-clear-btn" onclick="clearReview()">Wyczyść listę</button>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
/* ─── DATA ─────────────────────────────────────────────── */
let approvedIncidents = [];
let pendingReviewIncidents = [];
let incidents = [];
let markers   = {};          // id → leaflet layer
let clusterGroup = null;
let rejectedIds      = new Set(JSON.parse(localStorage.getItem('rejectedIds') || '[]'));
let activeSourceFilter = new Set(); // empty = show all
const reviewMode = new URLSearchParams(window.location.search).get('review') === '1';

/* ─── MAP INIT ──────────────────────────────────────────── */
const POLAND_BOUNDS = L.latLngBounds(
  L.latLng(49.0, 14.1),   // SW – lekki margines
  L.latLng(55.0, 24.2)    // NE – lekki margines
);

const map = L.map('map', {
  center: [52.1, 19.4],
  zoom: 6.5,
  minZoom: 6,
  maxZoom: 19,
  zoomSnap: 0.5,
  zoomDelta: 0.5,
  maxBounds: POLAND_BOUNDS,
  maxBoundsViscosity: 0.85,
  zoomControl: true,
  attributionControl: false
});

const tileSets = {
  dark: [
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, subdomains:'abc' }),
    null
  ],
  light: [
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, subdomains:'abc' }),
    null
  ],
  satellite: [
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom:19 }),
    null
  ]
};

const themeFromStorage = localStorage.getItem('mapTheme');
let currentTheme = themeFromStorage && tileSets[themeFromStorage] ? themeFromStorage : 'light';
let activeTiles = [];

function applyTiles(theme) {
  if (!tileSets[theme]) theme = 'light';
  activeTiles.forEach(t => { if(t) map.removeLayer(t); });
  activeTiles = tileSets[theme];
  activeTiles.forEach(t => { if(t) t.addTo(map); });
}

function setTheme(theme, btn) {
  document.documentElement.setAttribute('data-theme', theme);
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyTiles(theme);
  currentTheme = theme;
  localStorage.setItem('mapTheme', theme);
}

// init tiles
applyTiles(currentTheme);
// sync button state
const initBtn = document.querySelector(`.theme-btn[data-theme="${currentTheme}"]`);
if (initBtn) {
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
  initBtn.classList.add('active');
}
// init theme vars
document.documentElement.setAttribute('data-theme', currentTheme);


/* ─── MARKER ─────────────────────────────────────────────── */
const typeIcons = { crash:'car-burst', fire:'fire', flood:'water', other:'circle-exclamation' };
const typeLabels = { crash:'Wypadek', fire:'Pożar', flood:'Powódź', other:'Inne' };

function rebuildIncidents() {
  incidents = [...approvedIncidents, ...pendingReviewIncidents];
}

function createMarker(inc) {
  const div = document.createElement('div');
  const typeClass = inc.pendingReview ? 'pending' : inc.type;
  div.className = `pulse-marker pm-${typeClass} sev-${inc.severity}`;
  div.innerHTML = `<div class="ring"></div><div class="dot"></div>`;

  const icon = L.divIcon({ html: div, className: '', iconSize: [20,20], iconAnchor: [10,10] });
  const m = L.marker([inc.lat, inc.lng], { icon })
    .bindPopup(buildPopup(inc), { maxWidth: 280 });

  m.__incidentId = inc.id;
  markers[inc.id] = m;
  clusterGroup.addLayer(m);
}

function buildPopup(inc) {
  const sev = ['','🟢 Niski','🟡 Średni','🔴 Wysoki'][inc.severity];
  const dateStr = inc.date ? new Date(inc.date).toLocaleString('pl-PL') : 'brak daty';
  const sourceHtml = Array.isArray(inc.sources) && inc.sources.length
    ? `<div style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(127,127,127,.25)">
        <div style="font-size:.72rem;color:#7a849e;margin-bottom:5px"><i class="fa-solid fa-link" style="margin-right:4px"></i>Źródła</div>
        ${inc.sources.slice(0,3).map(s => `<div style="font-size:.76rem;margin:3px 0"><a href="${s.url}" target="_blank" rel="noopener noreferrer" style="color:#7db4ff;text-decoration:none">• ${s.name || 'Artykuł'}</a></div>`).join('')}
      </div>`
    : '';
  const pendingBadge = inc.pendingReview ? `<span style="font-size:.68rem;padding:2px 7px;border-radius:20px;background:rgba(125,180,255,.2);color:#7db4ff">Do zatwierdzenia</span>` : '';
  const lockedBadge = inc.locked ? `<span style="font-size:.68rem;padding:2px 7px;border-radius:20px;background:rgba(42,157,143,.2);color:#2a9d8f">Zatwierdzone</span>` : '';
  const deleteBtn = '';
  const safeId = inc.id.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  const safeTitle = (inc.title || '').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const approveBtn = (inc.pendingReview && reviewMode)
    ? `<div style="display:flex;gap:6px;margin-top:10px">
        <button onclick="addToReview('${safeId}','${safeTitle}')" style="flex:1;padding:7px;background:rgba(42,157,143,.15);border:1px solid rgba(42,157,143,.4);border-radius:6px;color:#2a9d8f;cursor:pointer;font-size:.75rem;font-family:'Inter',sans-serif"><i class="fa-solid fa-check"></i> Zatwierdź</button>
        <button onclick="rejectIncident('${safeId}')" style="flex:1;padding:7px;background:rgba(230,57,70,.12);border:1px solid rgba(230,57,70,.4);border-radius:6px;color:#e63946;cursor:pointer;font-size:.75rem;font-family:'Inter',sans-serif"><i class="fa-solid fa-ban"></i> Odrzuć</button>
      </div>`
    : '';
  return `
    <div style="font-family:'Inter',sans-serif">
      <div style="font-weight:700;font-size:.9rem;margin-bottom:6px">${inc.title}</div>
      <div style="display:flex;gap:6px;margin-bottom:6px;align-items:center">
        <span style="font-size:.7rem;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,.08)">${typeLabels[inc.type]}</span>
        <span style="font-size:.75rem">${sev}</span>
        ${pendingBadge}
        ${lockedBadge}
      </div>
      <div style="font-size:.75rem;color:#7a849e;margin-bottom:4px"><i class="fa-regular fa-clock" style="margin-right:4px"></i>${dateStr}</div>
      ${inc.desc ? `<div style="font-size:.78rem;color:#a0a8c0;margin-top:6px;line-height:1.5">${inc.desc}</div>` : ''}
      <div style="font-size:.65rem;color:#3a4060;margin-top:8px;font-family:monospace">${inc.lat.toFixed(5)}, ${inc.lng.toFixed(5)}</div>
      ${sourceHtml}
      ${deleteBtn}
      ${approveBtn}
    </div>`;
}

/* ─── REVIEW PANEL ──────────────────────────────────────── */
const reviewQueue = new Map(); // id → title

function copyDiscoverCmd() {
  navigator.clipboard.writeText('node scripts/discover_incidents.mjs').then(() => {
    showToast('<i class="fa-solid fa-copy"></i> Komenda skopiowana — wklej w terminal VS Code');
  });
}

function addToReview(id, title) {
  if (reviewQueue.has(id)) {
    showToast('<i class="fa-solid fa-info-circle"></i> Już na liście do zatwierdzenia');
    return;
  }
  reviewQueue.set(id, title);
  renderReviewPanel();
  map.closePopup();
  showToast(`<i class="fa-solid fa-check-circle"></i> Dodano do kolejki: <strong>${title}</strong>`);
}

function removeFromReview(id) {
  reviewQueue.delete(id);
  renderReviewPanel();
}

function clearReview() {
  reviewQueue.clear();
  renderReviewPanel();
}

function renderReviewPanel() {
  const panel = document.getElementById('review-panel');
  const list  = document.getElementById('review-list');
  const cmdWrap = document.getElementById('review-cmd-wrap');
  const empty   = document.getElementById('review-empty');

  if (!reviewQueue.size) {
    list.innerHTML = '<span id="review-empty">Brak wybranych — kliknij "Zatwierdź" na markerze.</span>';
    cmdWrap.style.display = 'none';
    return;
  }

  const ids = [...reviewQueue.keys()];
  list.innerHTML = ids.map(id =>
    `<div class="rv-item">
       <span>${reviewQueue.get(id)}</span>
       <span class="rv-remove" onclick="removeFromReview('${id}')" title="Usuń z listy">&times;</span>
     </div>`
  ).join('');

  const cmd = `$env:INCIDENT_IDS="${ids.join(',')}"; node scripts/approve_incidents.mjs`;
  document.getElementById('review-cmd').textContent = cmd;
  cmdWrap.style.display = 'block';
}

function copyReviewCmd() {
  const cmd = document.getElementById('review-cmd').textContent;
  navigator.clipboard.writeText(cmd).then(() => {
    showToast('<i class="fa-solid fa-copy"></i> Komenda skopiowana do schowka');
  });
}

async function loadApprovedIncidents() {
  try {
    const response = await fetch(`data/approved_incidents.json?t=${Date.now()}`);
    if (!response.ok) return;
    const data = await response.json();
    if (!Array.isArray(data)) return;
    approvedIncidents = data
      .filter(i => Number.isFinite(i.lat) && Number.isFinite(i.lng))
      .map(i => ({
        id: i.id,
        title: i.title || 'Zdarzenie',
        type: i.type || 'crash',
        severity: i.severity || 2,
        date: i.date || null,
        desc: i.desc || '',
        lat: i.lat,
        lng: i.lng,
        sources: Array.isArray(i.sources) ? i.sources : [],
        locked: true
      }));
  } catch {
    // Brak zatwierdzonych danych nie powinien zatrzymać mapy.
  }
}

async function loadPendingReviewIncidents() {
  if (!reviewMode) return;
  try {
    const response = await fetch(`data/pending_incidents.json?t=${Date.now()}`);
    if (!response.ok) return;
    const data = await response.json();
    if (!Array.isArray(data)) return;
    pendingReviewIncidents = data
      .filter(i => Number.isFinite(i.lat) && Number.isFinite(i.lng))
      .map(i => ({
        id: i.id,
        title: i.title || 'Kandydat zdarzenia',
        type: i.type || 'crash',
        severity: i.severity || 2,
        date: i.date || i.collectedAt || null,
        desc: i.desc || '',
        lat: i.lat,
        lng: i.lng,
        sources: Array.isArray(i.sources) ? i.sources : [],
        pendingReview: true,
        locked: true
      }));
  } catch {
    // Brak kandydatów nie powinien zatrzymać mapy.
  }
}

/* ─── SOURCE FILTER ──────────────────────────────────── */
function getSourceKey(s) {
  // prefer human-readable name; fallback to stripped domain
  if (s.name && s.name.trim() && s.name !== 'Artykuł') return s.name.trim();
  try { return new URL(s.url).hostname.replace(/^www\./, ''); }
  catch { return s.url || 'Nieznane'; }
}

function buildSourcePanel() {
  const counts = new Map();
  incidents.forEach(inc => {
    (inc.sources || []).forEach(s => {
      if (!s.url && !s.name) return;
      const key = getSourceKey(s);
      counts.set(key, (counts.get(key) || 0) + 1);
    });
  });
  const top = [...counts.entries()].sort((a,b) => b[1] - a[1]).slice(0, 15);
  const panel = document.getElementById('source-panel');
  if (!top.length) {
    document.getElementById('source-chips').innerHTML = '<span style="font-size:.72rem;color:var(--text2);font-style:italic">Brak danych źródłowych</span>';
    return;
  }
  document.getElementById('source-chips').innerHTML = top.map(([key, count]) => {
    const safeAttr = key.replace(/"/g, '&quot;');
    const safeJs   = key.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    return `<button class="src-chip" data-domain="${safeAttr}" onclick="toggleSourceFilter('${safeJs}')">
      <span>${key.replace(/</g,'&lt;')}</span><span class="src-count">${count}</span>
    </button>`;
  }).join('');
}

function toggleSourceFilter(domain) {
  if (activeSourceFilter.has(domain)) {
    activeSourceFilter.delete(domain);
  } else {
    activeSourceFilter.add(domain);
  }
  document.querySelectorAll('.src-chip').forEach(el => {
    el.classList.toggle('active', activeSourceFilter.has(el.dataset.domain));
  });
  filterMarkers();
}

function clearSourceFilter() {
  activeSourceFilter.clear();
  document.querySelectorAll('.src-chip').forEach(el => el.classList.remove('active'));
  filterMarkers();
}

/* ─── REJECT ─────────────────────────────────────────────── */
function rejectIncident(id) {
  rejectedIds.add(id);
  localStorage.setItem('rejectedIds', JSON.stringify([...rejectedIds]));
  map.closePopup();
  filterMarkers();
  showToast('<i class="fa-solid fa-ban"></i> Odrzucono — nie będzie pokazywany ponownie');
}

/* ─── TIMELINE FILTER ──────────────────────────────────── */
let timelineEnabled = true;
let timelineDays    = 7;

function tlLabel(days) {
  if (days === 0)   return 'Dziś';
  if (days === 1)   return '1 dzień';
  if (days <= 4)    return `${days} dni`;
  if (days < 14)    return `${days} dni`;
  if (days < 30)    return `${days} dni`;
  if (days < 60)    return 'Miesiąc';
  if (days < 365)   return `${Math.round(days/30)} mies.`;
  return 'Rok';
}

function filterMarkers() {
  clusterGroup.clearLayers();
  let cutoffMs;
  if (!timelineEnabled) {
    cutoffMs = -Infinity;
  } else if (timelineDays === 0) {
    // only today: from midnight of today
    const today = new Date(); today.setHours(0,0,0,0);
    cutoffMs = today.getTime();
  } else {
    cutoffMs = Date.now() - timelineDays * 86_400_000;
  }
  incidents.forEach(inc => {
    const m = markers[inc.id];
    if (!m) return;
    // skip rejected pending
    if (inc.pendingReview && rejectedIds.has(inc.id)) return;
    // timeline filter
    const ts = inc.date ? new Date(inc.date).getTime() : NaN;
    if (timelineEnabled && !isNaN(ts) && ts < cutoffMs) return;
    // source filter (only if at least one chip selected)
    if (activeSourceFilter.size > 0) {
      const keys = (inc.sources || []).map(s => getSourceKey(s));
      if (!keys.some(k => activeSourceFilter.has(k))) return;
    }
    clusterGroup.addLayer(m);
  });
}

function updateTimelineTrack(val) {
  const slider = document.getElementById('tl-slider');
  const pct = (val / 365 * 100).toFixed(2);
  slider.style.setProperty('--pct', pct + '%');
}

function onTimelineSlider(val) {
  timelineDays = +val;
  timelineEnabled = true;
  const bar = document.getElementById('timeline-bar');
  bar.classList.remove('tl-off');
  document.getElementById('tl-label').textContent = tlLabel(timelineDays);
  document.getElementById('tl-toggle').textContent = 'Pokaż wszystkie';
  updateTimelineTrack(timelineDays);
  filterMarkers();
}

function toggleTimeline() {
  timelineEnabled = !timelineEnabled;
  const bar = document.getElementById('timeline-bar');
  if (timelineEnabled) {
    bar.classList.remove('tl-off');
    document.getElementById('tl-toggle').textContent = 'Pokaż wszystkie';
  } else {
    bar.classList.add('tl-off');
    document.getElementById('tl-toggle').textContent = 'Włącz filtr';
  }
  filterMarkers();
}

/* ─── TOAST ─────────────────────────────────────────────── */
let toastTimer;
function showToast(html) {
  const t = document.getElementById('toast');
  t.innerHTML = html;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

/* ─── INIT ──────────────────────────────────────────────── */
(async () => {
  await loadApprovedIncidents();
  await loadPendingReviewIncidents();
  rebuildIncidents();
  clusterGroup = L.markerClusterGroup({
    maxClusterRadius: 40,
    showCoverageOnHover: false,
    spiderfyOnMaxZoom: true,
    disableClusteringAtZoom: 14
  });
  incidents.forEach(createMarker);
  map.addLayer(clusterGroup);
  document.getElementById('tl-label').textContent = tlLabel(timelineDays);
  updateTimelineTrack(timelineDays);
  filterMarkers();
  buildSourcePanel();
  if (reviewMode) {
    document.getElementById('review-panel').style.display = 'block';
    showToast('<i class="fa-solid fa-eye"></i> Tryb review: widoczni kandydaci do zatwierdzenia');
  }
})();
</script>
