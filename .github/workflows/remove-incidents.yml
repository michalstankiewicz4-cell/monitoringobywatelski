name: Remove Approved Incidents

on:
  workflow_dispatch:
    inputs:
      incident_ids:
        description: 'ID zdarzeń do usunięcia z mapy, rozdzielone przecinkiem'
        required: true
        type: string

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Usuń incydenty z mapy
        env:
          INCIDENT_IDS: ${{ inputs.incident_ids }}
          GITHUB_ACTIONS: 'true'
        run: node scripts/remove_incident.mjs

      - name: Commit usunięcia
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/approved_incidents.json
          git diff --staged --quiet || git commit -m "chore(data): remove $(echo '${{ inputs.incident_ids }}' | tr ',' '\n' | wc -l | tr -d ' ') incidents from map"
          git push origin main
