name: Discover Police Incidents

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Discover incidents
        run: node scripts/discover_incidents.mjs

      - name: Commit discovered incidents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/approved_incidents.json
          git diff --staged --quiet || git commit -m "chore(data): auto-publish previous-day police incidents"
          git push origin main
