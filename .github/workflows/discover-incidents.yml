name: Discover Police Incidents

on:
  schedule:
    - cron: '25 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Discover incidents
        run: node scripts/discover_incidents.mjs

      - name: Create PR with pending updates
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(data): update pending incidents candidates'
          branch: automation/discover-incidents
          title: 'chore(data): update pending incidents candidates'
          body: |
            Automatyczne pobranie kandydatów zdarzeń (wypadki powiązane z policją).
            
            - dane zapisane do `data/pending_incidents.json`
            - wymagają ręcznej weryfikacji przed zatwierdzeniem
          labels: automation,pending-review
          delete-branch: true
