name: Approve Pending Incidents

on:
  workflow_dispatch:
    inputs:
      incident_ids:
        description: 'ID zdarzeń do zatwierdzenia, rozdzielone przecinkiem (np. auto_x,auto_y)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Promote selected incidents
        env:
          INCIDENT_IDS: ${{ inputs.incident_ids }}
        run: node scripts/approve_incidents.mjs

      - name: Commit and push approved updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/approved_incidents.json data/pending_incidents.json
          git diff --staged --quiet || git commit -m "chore(data): approve selected incidents"
          git push origin main
